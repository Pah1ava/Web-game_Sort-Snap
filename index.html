<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14243b">
  <meta name="description" content="Sort & Snap is a short, touch-friendly sorting puzzle.">
  <title>Sort & Snap</title>
  <link rel="stylesheet" href="styles.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div><span class="eyebrow">A tiny sorting puzzle</span><h1>Sort <span>&</span> Snap</h1></div>
      <button id="soundButton" class="icon-button" type="button" aria-label="Mute sound" title="Toggle sound">♪</button>
    </header>

    <section class="game" aria-label="Sorting game">
      <div class="topbar">
        <div><span class="eyebrow">LEVEL</span><strong id="levelLabel">01</strong></div>
        <div class="progress-wrap"><span id="progressText">0 / 6 sorted</span><div class="progress" role="progressbar" aria-label="Objects sorted" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0"><div id="progressFill"></div></div></div>
        <button id="restartButton" class="restart" type="button" title="Restart level" aria-label="Restart level">↻</button>
      </div>

      <div class="scene">
        <div class="scene-header"><span class="badge">MATCH THE SHAPE</span><p id="instruction">Drag the object into the matching bin</p></div>
        <div id="bins" class="bins" aria-label="Sorting bins"></div>
        <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
        <div class="tray-label"><span>YOUR TRAY</span><span id="remaining">6 LEFT</span></div>
        <div class="tray">
          <div id="objectSlot" class="object-slot"></div>
          <div class="next"><span>UP NEXT</span><div id="queue" class="queue" aria-label="Upcoming objects"></div></div>
        </div>
        <p class="tip">Drag and drop, or tap an object and then a bin.</p>
      </div>

      <div id="result" class="result hidden" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
        <div class="result-card"><div class="result-icon">✦</div><span class="eyebrow">TRAY CLEARED</span><h2 id="resultTitle">Nicely sorted!</h2><p id="resultCopy">Every object found its place.</p><div class="result-actions"><button id="nextButton" class="primary" type="button">Next level →</button><button id="againButton" class="secondary" type="button">Play again</button></div></div>
      </div>
    </section>
    <footer></footer>
  </main>
</body>
</html>
